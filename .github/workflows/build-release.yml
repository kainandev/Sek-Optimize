name: Build e Release

# Dispara ao subir algo na main (ou manualmente).
# Le a versao de config.py (VERSION_SOFTWARE), compila o EXE com PyInstaller
# e publica uma Release com o executavel para download.
# So cria a Release se ainda nao existir uma com a mesma versao, entao
# commits que nao mudam a versao nao geram releases duplicados.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Obter versao
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path config.py -Pattern 'VERSION_SOFTWARE\s*=\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versao detectada: $v"

      - name: Verificar se a release ja existe
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag ja existe - pulando build/release."
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Release $tag ainda nao existe - prosseguindo."
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Compilar executavel
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $spec = "SekOptimize-$v.spec"
          if (Test-Path $spec) {
            Write-Host "Compilando com o spec: $spec"
            pyinstaller --noconfirm $spec
          } else {
            Write-Host "Spec nao encontrado, compilando a partir de main.py"
            pyinstaller --noconfirm --onefile --windowed `
              --icon icon.ico --name "SekOptimize-$v" `
              --add-data "icon.ico;." main.py
          }

      - name: Publicar Release
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "dist/SekOptimize-$v.exe"
          if (-not (Test-Path $exe)) {
            throw "Executavel nao encontrado: $exe"
          }
          gh release create "v$v" "$exe" `
            --title "Sek Optimize v$v" `
            --generate-notes
